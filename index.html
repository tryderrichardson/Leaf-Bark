<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Leaf & Bark — UK Tree ID</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1F3423">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEEE3;
    --surface:#FBFAF5;
    --ink:#22301E;
    --ink-soft:#5B6656;
    --forest:#2F4B33;
    --forest-dark:#1F3423;
    --bark:#8B5433;
    --moss:#6E8C4E;
    --rust:#A6442C;
    --line:#D8D6C6;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--surface);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  header{
    padding:28px 24px 16px;
    border-bottom:1px solid var(--line);
  }
  header .kicker{
    font-size:12.5px;
    letter-spacing:0.02em;
    color:var(--bark);
    margin:0 0 2px;
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:28px;
    margin:0;
    color:var(--forest-dark);
    line-height:1.1;
  }
  main{
    flex:1;
    padding:24px;
    display:flex;
    flex-direction:column;
  }
  .field-note{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.5;
    margin:0 0 24px;
    max-width:38ch;
  }
  .mode-card{
    display:block;
    width:100%;
    text-align:left;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 18px;
    margin-bottom:14px;
    cursor:pointer;
    font-family:inherit;
    transition:border-color .15s ease, transform .1s ease;
  }
  .mode-card:active{transform:scale(0.99);}
  .mode-card:hover{border-color:var(--forest);}
  .mode-card:disabled{opacity:0.45;cursor:not-allowed;}
  .mode-card h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 6px;
    color:var(--forest-dark);
  }
  .mode-card p{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0;
    line-height:1.4;
  }
  .filter-group{
    margin-bottom:16px;
  }
  .filter-group h3{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 8px;
    font-weight:600;
  }
  .filter-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .filter-check{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--ink);
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:6px 10px;
    cursor:pointer;
    text-transform:capitalize;
  }
  .filter-check input{
    accent-color:var(--forest);
  }
  .filter-row select{
    font-family:inherit;
    font-size:12.5px;
    color:var(--ink);
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:7px 8px;
  }
  .diff-card-wrap{
    margin-bottom:12px;
  }
  .diff-card{
    display:block;
    width:100%;
    text-align:left;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    cursor:pointer;
    font-family:inherit;
  }
  .diff-card:hover{border-color:var(--forest);}
  .diff-card:disabled{opacity:0.45;cursor:not-allowed;}
  .diff-card h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    margin:0 0 4px;
    color:var(--forest-dark);
  }
  .diff-card p{
    font-size:13px;
    color:var(--ink-soft);
    margin:0;
  }
  .see-species-btn{
    background:none;
    border:none;
    padding:6px 2px;
    color:var(--bark);
    font-size:12.5px;
    font-weight:600;
    text-decoration:underline;
    text-underline-offset:2px;
    cursor:pointer;
    font-family:inherit;
  }
  .see-species-btn:disabled{color:var(--ink-soft);opacity:0.5;cursor:not-allowed;text-decoration:none;}
  .species-list-inline{
    font-size:12.5px;
    color:var(--ink-soft);
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 12px;
    margin-top:4px;
    line-height:1.6;
  }
  .link-row{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
  }
  .text-link{
    background:none;border:none;padding:6px 0;
    color:var(--bark);font-size:13.5px;cursor:pointer;
    font-family:inherit;font-weight:600;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .stats-panel{
    margin-top:auto;
    padding-top:20px;
    border-top:1px solid var(--line);
  }
  .stats-panel h3{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 10px;
    font-weight:600;
  }
  .stat-row{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    padding:6px 0;
    border-bottom:1px dashed var(--line);
  }
  .stat-row:last-child{border-bottom:none;}
  .stat-row .label{color:var(--ink-soft);}
  .stat-row .value{font-weight:600;color:var(--forest-dark);}

  /* Progress / confidence screen */
  .progress-item{
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .progress-item .row1{
    display:flex;
    flex-direction:column;
    gap:2px;
    font-size:14px;
    margin-bottom:6px;
  }
  .progress-item .name{font-weight:600;color:var(--forest-dark);}
  .progress-item .rate{color:var(--ink-soft);font-size:12.5px;}
  .bar-track{
    height:6px;
    background:var(--bg);
    border-radius:3px;
    overflow:hidden;
  }
  .bar-fill{height:100%;background:var(--moss);}

  /* Quiz screens */
  .progress{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
  }
  .progress .score{color:var(--bark);font-weight:600;}
  .skip-row{
    display:flex;
    justify-content:flex-end;
    margin-bottom:10px;
  }
  .specimen-frame{
    width:100%;
    aspect-ratio:1/1;
    background:#E2E4D5;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    margin-bottom:8px;
  }
  .specimen-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .specimen-frame .loading{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    padding:0 20px;
  }
  .attribution{
    font-size:11px;
    color:var(--ink-soft);
    margin:0 0 20px;
    text-align:right;
  }
  .prompt-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:24px;
    color:var(--forest-dark);
    text-align:center;
    margin:8px 0 20px;
  }
  .answer-row{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  input[type=text]{
    flex:1;
    font-family:inherit;
    font-size:16px;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--bg);
    color:var(--ink);
  }
  input[type=text]:focus{outline:2px solid var(--forest);outline-offset:-1px;}
  input[type=text]:disabled{opacity:0.6;}
  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:var(--radius);
    padding:12px 18px;
    cursor:pointer;
  }
  .btn-primary{background:var(--forest);color:#fff;}
  .btn-primary:disabled{background:#A9B6A2;cursor:not-allowed;}
  .btn-secondary{background:none;border:1px solid var(--line);color:var(--ink);}
  .btn-skip{background:none;border:none;color:var(--ink-soft);font-size:13px;text-decoration:underline;text-underline-offset:2px;padding:4px 0;}
  .btn-block{width:100%;padding:14px;}
  .feedback{
    border-radius:var(--radius);
    padding:12px 14px;
    font-size:14px;
    margin-bottom:14px;
    display:none;
  }
  .feedback.correct{background:#E4EBDB;color:var(--forest-dark);display:block;}
  .feedback.incorrect{background:#F1E1DA;color:var(--rust);display:block;}
  .feedback.skipped{background:#EAE8DC;color:var(--ink-soft);display:block;}
  .feedback .true-name{font-style:italic;}

  .choice-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:14px;
  }
  .choice-tile{
    border:2px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    background:#E2E4D5;
    aspect-ratio:1/1;
    cursor:pointer;
    padding:4px;
    position:relative;
  }
  .choice-tile img{width:100%;height:100%;object-fit:cover;display:block;}
  .choice-tile.correct{border-color:var(--moss);}
  .choice-tile.incorrect{border-color:var(--rust);}
  .choice-tile:disabled{cursor:default;}

  .name-choice-grid{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:14px;
  }
  .name-choice{
    text-align:left;
    background:var(--surface);
    border:2px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    font-family:inherit;
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    cursor:pointer;
  }
  .name-choice.correct{border-color:var(--moss);background:#E4EBDB;}
  .name-choice.incorrect{border-color:var(--rust);background:#F1E1DA;}
  .name-choice:disabled{cursor:default;}

  .results-score{
    font-family:'Fraunces',serif;
    font-weight:900;
    font-size:56px;
    text-align:center;
    color:var(--forest-dark);
    margin:20px 0 4px;
  }
  .results-label{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    margin-bottom:8px;
  }
  .results-skip-note{
    text-align:center;
    color:var(--ink-soft);
    font-size:12.5px;
    margin-bottom:28px;
  }
  .top-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
  }
  .back-link{
    background:none;border:none;padding:0;
    color:var(--ink-soft);font-size:13px;cursor:pointer;
    font-family:inherit;
  }
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <header>
    <p class="kicker">Field Journal</p>
    <h1 id="page-title">Leaf &amp; Bark</h1>
  </header>
  <main id="main"></main>
</div>

  { common:"Plum", sci:"Prunus domestica", accepted:["plum"], difficulty:"medium", type:"broadleaf", nativeStatus:"non-native", commercialStatus:"orchard" },
  { common:"Fig", sci:"Ficus carica", accepted:["fig","common fig"], difficulty:"easy", type:"broadleaf", nativeStatus:"non-native", commercialStatus:"orchard" },
  { common:"Quince", sci:"Cydonia oblonga", accepted:["quince"], difficulty:"medium", type:"broadleaf", nativeStatus:"non-native", commercialStatus:"orchard" },
  { common:"Medlar", sci:"Mespilus germanica", accepted:["medlar"], difficulty:"hard", type:"broadleaf", nativeStatus:"non-native", commercialStatus:"orchard" },
  { common:"Black Mulberry", sci:"Morus nigra", accepted:["black mulberry","mulberry"], difficulty:"medium", type:"broadleaf", nativeStatus:"non-native", commercialStatus:"orchard" },
  { common:"Damson", sci:"Prunus insititia", accepted:["damson"], difficulty:"hard", type:"broadleaf", nativeStatus:"non-native", commercialStatus:"orchard" },
];

const DIFFICULTIES = [
  { key:"easy", label:"Easy" },
  { key:"medium", label:"Medium" },
  { key:"hard", label:"Hard" },
  { key:"expert", label:"Expert" },
  { key:"all", label:"All" },
  { key:"weak", label:"Toughest for you" },
  { key:"forestry", label:"Forestry species" },
  { key:"orchard", label:"Orchard species" },
];
function difficultyLabel(key){
  const d = DIFFICULTIES.find(d => d.key===key);
  return d ? d.label : key;
}
// Keys that are gated by the leveling system (see LEVELS below). All other
// categories (All, Toughest for you, Forestry, Orchard) are always open.
const GATED_KEYS = new Set(["easy","medium","hard","expert"]);

// nativeStatus/commercialStatus are still recorded per species (see the
// SPECIES array) for possible future use, even though the tick-box filter
// UI has been removed in favour of dedicated Forestry/Orchard categories.
const NATIVE_STATUSES = ["native","naturalised","non-native"];
const COMMERCIAL_STATUSES = ["wild","forestry","orchard"];

// Difficulty pools overlap on purpose: a harder setting also draws on
// everything easier than it (more review material), except Expert, which
// draws only from Hard + Expert so it stays a genuine step up rather than
// mostly recycling easy species.
const DIFFICULTY_INCLUDES = {
  easy: ["easy"],
  medium: ["easy","medium"],
  hard: ["easy","medium","hard"],
  expert: ["hard","expert"],
};
const WEAK_SPOT_COUNT = 20;
function speciesForDifficulty(diff){
  if(diff==="all") return SPECIES;
  if(diff==="forestry") return SPECIES.filter(s => s.commercialStatus==="forestry");
  if(diff==="orchard") return SPECIES.filter(s => s.commercialStatus==="orchard");
  if(diff==="weak"){
    // The 20 species with the lowest tracked ID success rate, recomputed
    // live each time — untested species default to a mid-pack 50% so they
    // don't automatically outrank species you're actually struggling with.
    return [...SPECIES]
      .sort((a,b) => successRate(a.common) - successRate(b.common))
      .slice(0, WEAK_SPOT_COUNT);
  }
  const included = DIFFICULTY_INCLUDES[diff] || [diff];
  return SPECIES.filter(s => included.includes(s.difficulty));
}

/* ---------- Persistence ---------- */
const STORE_KEY = "leafbark_history_v1";
const TAXON_CACHE_KEY = "leafbark_taxon_cache_v1";
const STATS_KEY = "leafbark_species_stats_v1";

function loadHistory(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    mode1:{correct:0,total:0,sessions:[]},
    mode2:{correct:0,total:0,sessions:[]}
  };
}
function saveHistory(h){ localStorage.setItem(STORE_KEY, JSON.stringify(h)); }
let history = loadHistory();

function loadTaxonCache(){
  try{
    const raw = localStorage.getItem(TAXON_CACHE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function saveTaxonCache(c){ localStorage.setItem(TAXON_CACHE_KEY, JSON.stringify(c)); }
let taxonCache = loadTaxonCache();

// Per-species ID confidence: { "Silver Birch": { history:[bool,...] (last 20 attempts, most recent last), everCorrect:bool, lifetimeAttempts:n, lifetimeCorrect:n }, ... }
// Two separate measures are kept side by side:
//  - the rolling window (last 20) drives quiz weighting and level checkpoints,
//    so recent improvement is what unlocks progress, not a stale lifetime average
//  - lifetimeAttempts/lifetimeCorrect are a simple running total, kept purely
//    so you can see lifetime vs. recent performance on the confidence screen
// everCorrect never decays either, since the "ID it at least once" level
// checkpoints are a one-time proof, not a moving average.
const STATS_WINDOW = 20;
function loadStats(){
  try{
    const raw = localStorage.getItem(STATS_KEY);
    if(raw){
      const data = JSON.parse(raw);
      // Migrate old {attempts, correct} shape (pre rolling-window) to the current shape
      Object.keys(data).forEach(name => {
        const s = data[name];
        if(s && !Array.isArray(s.history)){
          const attempts = s.attempts || 0;
          const correct = s.correct || 0;
          const history = [];
          for(let i=0;i<correct;i++) history.push(true);
          for(let i=0;i<attempts-correct;i++) history.push(false);
          data[name] = {
            history: history.slice(-STATS_WINDOW),
            everCorrect: correct >= 1,
            lifetimeAttempts: attempts,
            lifetimeCorrect: correct
          };
        }else if(s && s.lifetimeAttempts === undefined){
          // rolling-window shape from before lifetime tracking was added back
          data[name].lifetimeAttempts = s.history.length;
          data[name].lifetimeCorrect = s.history.filter(Boolean).length;
        }
      });
      return data;
    }
  }catch(e){}
  return {};
}
function saveStats(s){ localStorage.setItem(STATS_KEY, JSON.stringify(s)); }
let speciesStats = loadStats();

function recordAttempt(commonName, wasCorrect){
  const s = speciesStats[commonName] || {history:[], everCorrect:false, lifetimeAttempts:0, lifetimeCorrect:0};
  s.history.push(wasCorrect);
  if(s.history.length > STATS_WINDOW) s.history.shift();
  if(wasCorrect) s.everCorrect = true;
  s.lifetimeAttempts += 1;
  if(wasCorrect) s.lifetimeCorrect += 1;
  speciesStats[commonName] = s;
  saveStats(speciesStats);
}
// Recent (last 20) rate — used for quiz weighting and level checkpoints
function successRate(commonName){
  const s = speciesStats[commonName];
  if(!s || !s.history.length) return 0.5; // unknown: moderate, neither favoured nor avoided
  return s.history.filter(Boolean).length / s.history.length;
}
// Lifetime rate — for display only, never used to gate or weight anything
function lifetimeRate(commonName){
  const s = speciesStats[commonName];
  if(!s || !s.lifetimeAttempts) return null;
  return s.lifetimeCorrect / s.lifetimeAttempts;
}

/* ---------- Leveling system ----------
   Gates Easy/Medium/Hard/Expert behind progression; "Toughest for you" and
   "All" are exempt and always available. Untested species count as 0% here
   (not the 50% neutral default used for quiz weighting) since progression
   should reflect proven ability, not an assumption.
   Renumbered sequentially (Level 1-7) to resolve a duplicate "Level 2" in
   the original spec — Level 2 = medium unlocked (all easy IDed once),
   Level 3 = medium mastery checkpoint (no new unlock), Level 4 = hard
   unlocked, Level 5 = hard mastery checkpoint (no new unlock), Level 6 =
   expert unlocked, Level 7 = Master. */
function rawSuccessRate(commonName){
  const s = speciesStats[commonName];
  if(!s || !s.history.length) return 0;
  return s.history.filter(Boolean).length / s.history.length;
}
function taggedPool(tag){ return SPECIES.filter(s => s.difficulty===tag); }
function allIdentifiedOnce(pool){
  return pool.every(s => (speciesStats[s.common] && speciesStats[s.common].everCorrect));
}
function pctAtConfidence(pool, minConf){
  if(!pool.length) return 1;
  return pool.filter(s => rawSuccessRate(s.common) >= minConf).length / pool.length;
}
const EASY_POOL = taggedPool("easy");
const MEDIUM_POOL = taggedPool("medium");
const HARD_POOL = taggedPool("hard");
const EXPERT_POOL = taggedPool("expert");

const LEVELS = [
  { name:"Level 2", unlocks:"medium",
    label:"ID all easy species correctly at least once",
    check: () => allIdentifiedOnce(EASY_POOL) },
  { name:"Level 3", unlocks:null,
    label:"ID all medium species correctly at least once",
    check: () => allIdentifiedOnce(MEDIUM_POOL) },
  { name:"Level 4", unlocks:"hard",
    label:"Reach 50% confidence on at least 50% of easy species and 50% of medium species",
    check: () => pctAtConfidence(EASY_POOL,0.5)>=0.5 && pctAtConfidence(MEDIUM_POOL,0.5)>=0.5 },
  { name:"Level 5", unlocks:null,
    label:"ID all hard species correctly at least once",
    check: () => allIdentifiedOnce(HARD_POOL) },
  { name:"Level 6", unlocks:"expert",
    label:"Reach 75% confidence on at least 80% of easy species and 80% of medium species, and 50% confidence on at least 50% of hard species",
    check: () => pctAtConfidence(EASY_POOL,0.75)>=0.8 && pctAtConfidence(MEDIUM_POOL,0.75)>=0.8 && pctAtConfidence(HARD_POOL,0.5)>=0.5 },
  { name:"Master", unlocks:null,
    label:"ID every species at least once, with 75% confidence on 100% of easy, 75% confidence on 75% of medium, 50% confidence on 50% of hard, and 40% confidence on 30% of expert species",
    check: () => allIdentifiedOnce(SPECIES)
      && pctAtConfidence(EASY_POOL,0.75)>=1.0
      && pctAtConfidence(MEDIUM_POOL,0.75)>=0.75
      && pctAtConfidence(HARD_POOL,0.5)>=0.5
      && pctAtConfidence(EXPERT_POOL,0.40)>=0.30 },
];

// Returns { levelName, unlocked: Set, nextRequirement: string|null }
function getProgression(){
  const unlocked = new Set(["easy"]);
  let levelName = "Level 1";
  let nextRequirement = LEVELS[0].label;
  for(const lvl of LEVELS){
    if(lvl.check()){
      levelName = lvl.name;
      if(lvl.unlocks) unlocked.add(lvl.unlocks);
    }else{
      nextRequirement = lvl.label;
      break;
    }
  }
  if(LEVELS.every(lvl => lvl.check())) nextRequirement = null;
  return { levelName, unlocked, nextRequirement };
}
// The requirement that specifically unlocks a given difficulty key (not
// just "whatever's next overall") — used for that difficulty's lock text.
function requirementForDifficulty(diffKey){
  const lvl = LEVELS.find(l => l.unlocks === diffKey);
  return lvl ? lvl.label : "";
}

/* ---------- Weighted species selection ----------
   Species answered less confidently appear more often; well-known species
   still appear occasionally rather than never. */
function weightFor(commonName){
  const rate = successRate(commonName);
  const w = 1.15 - rate; // 0% success -> 1.15, 100% success -> 0.15
  return Math.min(1.15, Math.max(0.15, w));
}
function weightedSampleSpecies(pool, n){
  const items = pool.map(s => ({ s, w: weightFor(s.common) }));
  const chosen = [];
  for(let i=0;i<n && items.length;i++){
    const totalWeight = items.reduce((sum,p)=>sum+p.w,0);
    let r = Math.random()*totalWeight;
    let idx = 0;
    for(; idx<items.length; idx++){
      r -= items[idx].w;
      if(r<=0) break;
    }
    idx = Math.min(idx, items.length-1);
    chosen.push(items[idx].s);
    items.splice(idx,1);
  }
  return chosen;
}

/* ---------- iNaturalist API ---------- */
// Hybrid species (e.g. "Platanus x hispanica", "Tilia x europaea") can fail
// a straight lookup: iNaturalist's own name may use "×" (multiplication
// sign) rather than the letter "x", and/or the taxon may not be ranked
// "species" in their system. Rather than guess a single fixed query, try
// several variants in order and use whichever first returns a match.
async function searchTaxa(q, rank){
  let url = `https://api.inaturalist.org/v1/taxa?q=${encodeURIComponent(q)}&per_page=3`;
  if(rank) url += `&rank=${rank}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("taxon search failed (HTTP " + res.status + ")");
  const data = await res.json();
  return data.results || [];
}
async function getTaxonId(species){
  const sci = species.sci;
  if(taxonCache[sci]) return taxonCache[sci];
  const attempts = [
    [sci, "species"],
    [sci, null],
  ];
  if(sci.includes(" x ")) attempts.push([sci.replace(" x ", " × "), null]);
  attempts.push([species.common, null]);
  for(const [q, rank] of attempts){
    try{
      const results = await searchTaxa(q, rank);
      if(results.length){
        const id = results[0].id;
        taxonCache[sci] = id;
        saveTaxonCache(taxonCache);
        return id;
      }
    }catch(e){ /* try next variant */ }
  }
  throw new Error("no taxon match for " + sci);
}

// Three-tier image quality preference, each falling back to the next if it
// comes back empty or errors — so a filter that turns out to be too narrow
// (or briefly wrong) degrades gracefully instead of breaking image loading:
//  1. Research-grade AND annotated "No Evidence of Flowering" — this is a
//     real, documented iNaturalist annotation (controlled term 12 "Plant
//     Phenology", value 21), and photos without flowers/buds/fruit in view
//     are overwhelmingly whole-plant or leaf shots, which is what we want.
//  2. Research-grade only (community-vetted, but no phenology filter).
//  3. Unfiltered — whatever has photos at all.
async function fetchObservations(taxonId, tier){
  let url = `https://api.inaturalist.org/v1/observations?taxon_id=${taxonId}&photos=true&per_page=50&order_by=votes`;
  if(tier >= 1) url += `&quality_grade=research`;
  if(tier >= 2) url += `&term_id=12&term_value_id=21`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("observation search failed (HTTP " + res.status + ")");
  const data = await res.json();
  return (data.results || []).filter(o => o.photos && o.photos.length);
}

// Returns { url, attribution }
async function getRandomPhoto(species){
  const taxonId = await getTaxonId(species);
  let withPhotos = [];
  for(const tier of [2, 1, 0]){
    try{
      withPhotos = await fetchObservations(taxonId, tier);
    }catch(e){
      withPhotos = [];
    }
    if(withPhotos.length) break;
  }
  if(!withPhotos.length) throw new Error("no photos found for " + species.sci);
  const obs = withPhotos[Math.floor(Math.random()*withPhotos.length)];
  const photo = obs.photos[Math.floor(Math.random()*obs.photos.length)];
  const mediumUrl = (photo.url || "").replace("square", "medium");
  if(!mediumUrl) throw new Error("photo had no url for " + species.sci);
  return {
    url: mediumUrl,
    attribution: photo.attribution || (obs.user && obs.user.login) || "iNaturalist"
  };
}

/* ---------- Fuzzy matching ---------- */
function normalize(s){
  return s.toLowerCase().trim().replace(/[^a-z0-9\s]/g,"").replace(/\s+/g," ");
}
function levenshtein(a,b){
  const m=a.length, n=b.length;
  const d = Array.from({length:m+1}, (_,i)=>[i, ...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
    }
  }
  return d[m][n];
}
function fuzzyMatches(input, candidate){
  const a = normalize(input), b = normalize(candidate);
  if(!a) return false;
  if(a===b) return true;
  const threshold = Math.max(1, Math.floor(b.length*0.22));
  return levenshtein(a,b) <= threshold;
}
function isCorrectAnswer(input, species){
  const candidates = [species.common, species.sci, ...species.accepted];
  return candidates.some(c => fuzzyMatches(input, c));
}

function startRound(mode, difficulty){

    pool,
    roundSize,
    order: weightedSampleSpecies(pool, roundSize),
    index: 0,
    score: 0,
    skipped: 0,
    busy: false
  };
  render();
}

// Whether a given question (in the current round's difficulty category)

// graded difficulty (Easy/Medium/Hard/Expert), only species at that
// difficulty's own "frontier" tier get the 4-choice scaffold — anything
// pulled in from an easier tier below it must be typed with no help.
function shouldUseChoice(difficultyKey, species){
  if(["all","weak","forestry","orchard"].includes(difficultyKey)) return true;
  return species.difficulty === difficultyKey;
}

    feedback.className = "feedback " + (correct ? "correct" : "incorrect");
    feedback.innerHTML = correct
      ? `Correct — <span class="true-name">${species.common}</span> (<em>${species.sci}</em>)`
      : `Not quite. It was <span class="true-name">${species.common}</span> (<em>${species.sci}</em>)`;
    lockAndShowNext();
  }

  skipBtn.onclick = () => {
    if(state.busy) return;
    state.skipped++;
    feedback.className = "feedback skipped";
    feedback.innerHTML = `Skipped — doesn't count toward your score. It was <span class="true-name">${species.common}</span> (<em>${species.sci}</em>)`;
    lockAndShowNext();
  };

  nextBtn.onclick = () => {
    state.index++;
    if(state.index >= state.roundSize) finishRound();
    else { state.busy=false; renderMode1(); }
  };

  if(useChoice){
    const distractorPool = state.pool.length >= 4 ? state.pool : SPECIES;
    const distractors = [...distractorPool].filter(s => s.common !== species.common).sort(()=>Math.random()-0.5).slice(0,3);
    const choices = [species, ...distractors].sort(()=>Math.random()-0.5);
    answerArea.innerHTML = `<div class="name-choice-grid">${choices.map((c,i)=>`<button class="name-choice" data-idx="${i}">${c.common}</button>`).join("")}</div>`;
    const buttons = Array.from(answerArea.querySelectorAll(".name-choice"));
    buttons.forEach((btn,i) => {
      btn.onclick = () => {
        if(state.busy) return;
        const chosen = choices[i];
        const correct = chosen.common === species.common;
        buttons.forEach((b,j) => {
          if(choices[j].common === species.common) b.classList.add("correct");
          else if(j===i) b.classList.add("incorrect");
        });
        finishQuestion(correct);
      };
    });
  }else{
    answerArea.innerHTML = `
      <div class="answer-row">
        <input type="text" id="answer-input" placeholder="Species name" autocomplete="off" autocapitalize="off" />
        <button class="btn-primary" id="submit-answer">Submit</button>
      </div>
    `;
    const input = document.getElementById("answer-input");
    const submitBtn = document.getElementById("submit-answer");
    submitBtn.onclick = () => {
      if(state.busy) return;
      const val = input.value;
      if(!val.trim()) return;
      const correct = isCorrectAnswer(val, species);
      finishQuestion(correct);
    };
    input.addEventListener("keydown", e => { if(e.key==="Enter") submitBtn.click(); });
  }

  const frame = document.getElementById("frame");
  const attributionEl = document.getElementById("attribution");
  try{
    const photo = await getRandomPhoto(species);
    frame.innerHTML = `<img src="${photo.url}" alt="specimen" onerror="this.closest('.specimen-frame').innerHTML='<span class=loading>Image failed to load — use Skip</span>'" />`;
    attributionEl.textContent = "Photo: " + photo.attribution;
  }catch(e){
    frame.innerHTML = `<span class="loading">Image unavailable — use Skip<br>(${e.message})</span>`;
  }
}

/* ---------- Mode 2: Name -> Picture ---------- */
async function renderMode2(){
  pageTitle.textContent = "Name → Picture";
  const species = state.order[state.index];
  const distractorPool = state.pool.length >= 4 ? state.pool : SPECIES;
  const distractors = [...distractorPool].filter(s => s.common !== species.common).sort(()=>Math.random()-0.5).slice(0,3);
  const choices = [species, ...distractors].sort(()=>Math.random()-0.5);

  main.innerHTML = `
    <div class="top-nav">
      <button class="back-link" id="back-home">← Home</button>
    </div>
    <div class="progress"><span>Question ${state.index+1} of ${state.roundSize}</span><span class="score">Score: ${state.score}/${state.index - state.skipped}</span></div>
    <div class="skip-row"><button class="btn-skip" id="skip-btn">Skip this one</button></div>
    <p class="prompt-name">${species.common}<br><em style="font-size:15px;color:var(--ink-soft);">${species.sci}</em></p>
    <div class="choice-grid" id="choice-grid">
      ${choices.map((c,i)=>`<button class="choice-tile" data-idx="${i}" disabled><span class="loading">…</span></button>`).join("")}
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="btn-primary btn-block hidden" id="next-btn">Next</button>
  `;
  document.getElementById("back-home").onclick = () => { state = {screen:"home"}; render(); };

  const tiles = Array.from(document.querySelectorAll(".choice-tile"));
  const skipBtn = document.getElementById("skip-btn");
  const feedback = document.getElementById("feedback");
  const nextBtn = document.getElementById("next-btn");

  function endQuestion(){
    tiles.forEach(t => t.disabled = true);
    skipBtn.disabled = true;
    nextBtn.classList.remove("hidden");
    state.busy = true;
  }

  skipBtn.onclick = () => {
    if(state.busy) return;
    state.skipped++;
    feedback.className = "feedback skipped";
    feedback.textContent = `Skipped — doesn't count toward your score.`;
    endQuestion();
  };

  nextBtn.onclick = () => {
    state.index++;
    if(state.index >= state.roundSize) finishRound();
    else { state.busy=false; renderMode2(); }
  };

  const photos = await Promise.all(choices.map(c =>
    getRandomPhoto(c).then(p => ({ ok:true, ...p })).catch(e => ({ ok:false, message: e.message }))
  ));

  tiles.forEach((tile, i) => {
    const photo = photos[i];
    if(photo.ok){
      tile.innerHTML = `<img src="${photo.url}" alt="${choices[i].common}" onerror="this.parentElement.innerHTML='<span class=loading>failed to load</span>';this.parentElement.disabled=true;" />`;
      tile.disabled = false;
    }else{
      tile.innerHTML = `<span class="loading">n/a<br>${photo.message}</span>`;
      tile.disabled = true;
    }
    tile.onclick = () => {
      if(state.busy || !photo.ok) return;
      const chosen = choices[i];
      const correct = chosen.common === species.common;
      if(correct) state.score++;
      recordAttempt(species.common, correct);
      tiles.forEach((t, j) => {
        if(choices[j].common === species.common) t.classList.add("correct");
        else if(j===i) t.classList.add("incorrect");
      });
      feedback.className = "feedback " + (correct ? "correct" : "incorrect");
      feedback.textContent = correct ? "Correct." : `Not quite — that was ${chosen.common}.`;
      endQuestion();
    };
  });
};

/* ---------- Results ---------- */
function finishRound(){
  const mode = state.mode;
  const answered = state.roundSize - state.skipped;
  history[mode].correct += state.score;
  history[mode].total += answered;
  history[mode].sessions.push({ date: new Date().toISOString(), score: state.score, answered });
  saveHistory(history);
  state = { screen:"results", mode, difficulty:state.difficulty, score: state.score, answered, skipped: state.skipped };
  render();
}

function renderResults(){
  pageTitle.textContent = "Round Complete";
  main.innerHTML = `
    <div class="results-score">${state.score}<span style="font-size:28px;color:var(--ink-soft);">/${state.answered}</span></div>
    <p class="results-label">${state.mode==="mode1" ? "Picture → Name" : "Name → Picture"} · ${difficultyLabel(state.difficulty)}</p>
    <p class="results-skip-note">${state.skipped ? state.skipped + " question" + (state.skipped>1?"s":"") + " skipped (not counted)" : ""}</p>
    <button class="btn-primary btn-block" id="again-btn">Play again</button>
    <button class="btn-secondary btn-block" id="home-btn" style="margin-top:10px;">Back home</button>
  `;
  document.getElementById("again-btn").onclick = () => startRound(state.mode, state.difficulty);
  document.getElementById("home-btn").onclick = () => { state = {screen:"home"}; render(); };
}

let progressFilters = { difficulty:"all", native:"all", commercial:"all", sort:"confidence-asc" };
const DIFFICULTY_ORDER = { easy:0, medium:1, hard:2, expert:3 };

function renderProgress(){
  pageTitle.textContent = "Species Confidence";
  let rows = [...SPECIES]
    .map(s => ({ s, rate: successRate(s.common), lifetime: lifetimeRate(s.common), stats: speciesStats[s.common] }))
    .filter(r => progressFilters.difficulty==="all" || r.s.difficulty===progressFilters.difficulty)
    .filter(r => progressFilters.native==="all" || r.s.nativeStatus===progressFilters.native)
    .filter(r => progressFilters.commercial==="all" || r.s.commercialStatus===progressFilters.commercial);

  if(progressFilters.sort==="confidence-asc") rows.sort((a,b) => a.rate - b.rate);
  else if(progressFilters.sort==="confidence-desc") rows.sort((a,b) => b.rate - a.rate);
  else if(progressFilters.sort==="difficulty") rows.sort((a,b) => DIFFICULTY_ORDER[a.s.difficulty] - DIFFICULTY_ORDER[b.s.difficulty] || a.s.common.localeCompare(b.s.common));

  main.innerHTML = `
    <div class="top-nav">
      <button class="back-link" id="back-home">← Home</button>
    </div>
    <p class="field-note">Recent = last ${STATS_WINDOW} attempts (used for quiz weighting and levels). Lifetime = every attempt ever. Lower recent confidence means a species is weighted to appear more often; species at 100% still turn up occasionally.</p>
    <div class="filter-group">
      <div class="filter-row">
        <select id="filter-difficulty">
          <option value="all">All difficulties</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
          <option value="expert">Expert</option>
        </select>
        <select id="filter-native">
          <option value="all">All native statuses</option>
          <option value="native">Native</option>
          <option value="naturalised">Naturalised</option>
          <option value="non-native">Non-native</option>
        </select>
        <select id="filter-commercial">
          <option value="all">All commercial statuses</option>
          <option value="wild">Wild</option>
          <option value="forestry">Forestry</option>
          <option value="orchard">Orchard</option>
        </select>
        <select id="filter-sort">
          <option value="confidence-asc">Sort: confidence (low first)</option>
          <option value="confidence-desc">Sort: confidence (high first)</option>
          <option value="difficulty">Sort: difficulty</option>
        </select>
      </div>
    </div>
    ${rows.map(r => {
      const attempts = r.stats ? r.stats.history.length : 0;
      const correct = r.stats ? r.stats.history.filter(Boolean).length : 0;
      const lifetimeText = r.lifetime===null ? "" : ` · Lifetime ${Math.round(r.lifetime*100)}% (${r.stats.lifetimeCorrect}/${r.stats.lifetimeAttempts})`;
      return `
      <div class="progress-item">
        <div class="row1">
          <span class="name">${r.s.common} <span style="color:var(--ink-soft);font-weight:400;">(${r.s.difficulty})</span></span>
          <span class="rate">${attempts ? "Recent " + Math.round(r.rate*100)+"% (" + correct + "/" + attempts + ")" + lifetimeText : "not yet tested"}</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${attempts ? Math.round(r.rate*100) : 0}%"></div></div>
      </div>
    `;}).join("")}
    ${rows.length===0 ? `<p class="field-note">No species match these filters.</p>` : ""}
  `;
  document.getElementById("back-home").onclick = () => { state = {screen:"home"}; render(); };
  document.getElementById("filter-difficulty").value = progressFilters.difficulty;
  document.getElementById("filter-native").value = progressFilters.native;
  document.getElementById("filter-commercial").value = progressFilters.commercial;
  document.getElementById("filter-sort").value = progressFilters.sort;
  document.getElementById("filter-difficulty").onchange = e => { progressFilters.difficulty = e.target.value; renderProgress(); };
  document.getElementById("filter-native").onchange = e => { progressFilters.native = e.target.value; renderProgress(); };
  document.getElementById("filter-commercial").onchange = e => { progressFilters.commercial = e.target.value; renderProgress(); };
  document.getElementById("filter-sort").onchange = e => { progressFilters.sort = e.target.value; renderProgress(); };
}

render();

// Register the service worker so the app shell loads instantly and works
// offline once installed. Only works when served over http(s) -- browsers
// block service worker registration on file:// pages for security reasons,
// so this silently does nothing if you're just opening the file locally.
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>
</body>
</html>
